[auth]
enabled = true
providers = ["email"]
# Open signup for demo users. Access to applications remains isolated per end-user account.

[ai]
required = true

[project]
name = "AI Loan Assistant"

[db.tables.applications]
read = "own"
write = "own"

# OCR provider configuration is supplied through the Hatchable setup gate.
[[secret]]
name = "DOCUMENT_OCR_URL"
expose = true
[[secret]]
name = "DOCUMENT_OCR_API_KEY"
expose = true
[[secret]]
name = "DOCUMENT_OCR_TIMEOUT_MS"
expose = true