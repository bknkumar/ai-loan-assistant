<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · AI Loan Assistant</title><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.card{background:white;border:1px solid #e5e9f0;border-radius:18px;padding:32px;width:min(380px,calc(100% - 48px));box-shadow:0 12px 40px #17203312}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9dee8;border-radius:10px;margin:8px 0 14px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#172033;color:white;font-weight:700}h1{margin:0 0 6px}.muted{color:#68738a}.error{color:#b42318;margin:10px 0}</style></head><body><div class="card"><div style="font-size:26px">✦</div><h1>AI Loan Assistant</h1><p class="muted">DSA demo workspace</p><form id="form"><label>Email</label><input id="email" type="email" required autocomplete="username webauthn"><div id="codeWrap" hidden><label>Verification code</label><input id="code" inputmode="numeric" maxlength="6"></div><div id="error" class="error"></div><button id="submit">Continue</button></form></div><script>const A=window.hatchable.auth;let step='email';const form=document.querySelector('#form');const email=document.querySelector('#email');const code=document.querySelector('#code');const wrap=document.querySelector('#codeWrap');const btn=document.querySelector('#submit');const error=document.querySelector('#error');form.onsubmit=async e=>{e.preventDefault();error.textContent='';try{if(step==='email'){await A.startLogin({email:email.value});step='code';wrap.hidden=false;code.required=true;btn.textContent='Sign in';code.focus()}else{await A.verifyCode({email:email.value,code:code.value});const next=new URLSearchParams(location.search).get('next')||'/';location.href=next.startsWith('/')?next:'/';}}catch(err){error.textContent=err.message||'Unable to sign in.'}}</script></body></html>
