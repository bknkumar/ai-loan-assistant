<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Loan Assistant</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#172033}.shell{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800;font-size:22px}.muted{color:#68738a}.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}.card{background:white;border:1px solid #e5e9f0;border-radius:16px;padding:18px;box-shadow:0 4px 18px #1720330b}button{border:0;border-radius:10px;padding:11px 15px;background:#172033;color:white;font-weight:700;cursor:pointer}button.secondary{background:#eef1f6;color:#172033}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9dee8;border-radius:10px;margin:8px 0 12px}.app{padding:13px;border-radius:11px;cursor:pointer;margin:5px 0}.app.active{background:#eef3ff}.messages{height:480px;overflow:auto;padding:8px}.msg{max-width:78%;padding:11px 14px;border-radius:14px;margin:10px 0;line-height:1.45;white-space:pre-wrap}.user{margin-left:auto;background:#172033;color:white}.assistant{background:#eef1f6}.composer{display:flex;gap:10px;margin-top:12px}.composer input{margin:0}.empty{padding:50px;text-align:center}.tag{font-size:12px;font-weight:700;color:#5d6b82}</style></head><body><div class="shell"><div class="top"><div><div class="brand">AI Loan Assistant</div><div class="muted">DSA secured business-loan workspace</div></div><button class="secondary" id="signout">Sign out</button></div><div class="grid"><aside class="card"><button id="new">＋ New customer</button><div id="apps" style="margin-top:15px"></div></aside><main class="card"><div id="main" class="empty"><div style="font-size:40px">✦</div><h2>Select an application</h2><p class="muted">Create a customer application to start the AI conversation.</p></div></main></div></div><script>const API=window.__HATCHABLE__.api;let current=null;const $=s=>document.querySelector(s);async function get(path,opt={}){const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json()}async function load(){const d=await get('/applications/list');$('#apps').innerHTML=d.applications.length?d.applications.map(a=>`<div class="app ${current?.id===a.id?'active':''}" data-id="${a.id}"><b>${a.customer_name||'New customer'}</b><div class="tag">${a.application_number}</div><div class="muted">${a.status}</div></div>`).join(''):'<p class="muted">No applications yet.</p>';document.querySelectorAll('.app').forEach(x=>x.onclick=()=>openApp(x.dataset.id))}async function openApp(id){current={id};const d=await get('/applications/'+id+'/conversation');current.app=d.application;render(d.messages);load()}function render(messages){$('#main').innerHTML=`<div><div class="tag">CONVERSATION</div><h2>${current.app.application_number}</h2><div class="messages" id="messages">${messages.map(m=>`<div class="msg ${m.role}"><b>${m.role==='user'?'You':'AI Assistant'}</b><br>${esc(m.content)}</div>`).join('')}</div><div class="composer"><input id="message" placeholder="Message the loan assistant…"><button id="send">→</button></div></div>`;const box=$('#messages');box.scrollTop=box.scrollHeight;$('#send').onclick=send;$('#message').onkeydown=e=>{if(e.key==='Enter')send()}}async function send(){const input=$('#message');const text=input.value.trim();if(!text||!current)return;input.disabled=true;$('#send').disabled=true;const box=$('#messages');box.insertAdjacentHTML('beforeend',`<div class="msg user"><b>You</b><br>${esc(text)}</div><div class="msg assistant" id="thinking"><b>AI Assistant</b><br>Thinking…</div>`);box.scrollTop=box.scrollHeight;input.value='';try{const d=await get('/applications/'+current.id+'/message',{method:'POST',body:JSON.stringify({message:text})});$('#thinking')?.remove();box.insertAdjacentHTML('beforeend',`<div class="msg assistant"><b>AI Assistant</b><br>${esc(d.message.content)}</div>`)}catch(e){$('#thinking')?.remove();box.insertAdjacentHTML('beforeend',`<div class="msg assistant"><b>AI Assistant</b><br>Sorry, I couldn't complete that request. Please try again.</div>`)}finally{input.disabled=false;$('#send').disabled=false;input.focus();box.scrollTop=box.scrollHeight;load()}}async function create(){const name=prompt('Customer name');if(!name)return;const d=await get('/applications/create',{method:'POST',body:JSON.stringify({customerName:name})});await load();openApp(d.application.id)}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}$('#new').onclick=create;$('#signout').onclick=()=>window.hatchable.auth.signOut().then(()=>location.reload());(async()=>{const s=await window.hatchable.auth.getSession();if(!s?.user){location.href='/login?next=/';return}load()})().catch(()=>location.href='/login?next=/');</script></body></html>
